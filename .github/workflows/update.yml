name: Update World Cup ICS Calendar

on:
  schedule:
    - cron: '0 */6 * * *' # Executes exactly every 6 hours
  workflow_dispatch: # Allows manual triggers within the GitHub interface

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Calendar Generator
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python generate_ics.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add world-cup.ics
          git diff-index --quiet HEAD || git commit -m "Automated schedule sync update"
          git push
